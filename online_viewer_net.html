<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>精选 YouTube 视频分类合集</title>
  <!-- 引入 Inter 字体以提升数字与多语言排版清晰度 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- 引入 Tailwind CSS 并配置深色模式与字体栈 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '"PingFang SC"', '"Hiragino Sans GB"', '"Microsoft YaHei"', 'sans-serif']
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-100 text-slate-900 dark:bg-zinc-950 dark:text-zinc-100 font-sans antialiased transition-colors duration-200 selection:bg-rose-500/30 selection:text-rose-200">
  <!-- 页面主容器 -->
  <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-8 sm:py-12">
    
    <!-- 顶部标题与工具栏 -->
    <header class="mb-8 sm:mb-10 pb-6 border-b border-zinc-800/90 flex flex-col gap-5">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-white">
          精选 YouTube 视频分类合集
        </h1>
      </div>

      <!-- 分类筛选标签栏 -->
      <nav aria-label="视频分类筛选" class="flex flex-wrap items-center gap-2.5 pt-1" id="category-tabs">
        <!-- 由脚本动态生成 -->
      </nav>
    </header>

    <!-- 视频分类内容区域 -->
    <main id="content" class="space-y-12"></main>

    <!-- 页脚说明 -->
    <footer class="mt-14 pt-6 border-t border-slate-200 dark:border-zinc-800/80 text-center text-xs text-slate-500 dark:text-zinc-500">
      点击任意视频卡片将在新标签页打开对应 YouTube 播放页面
    </footer>
  </div>

  <script>
    /**
     * 视频分组与完整元数据配置
     * 保留原始分享链接，并填入完整的标题、上传者与时长信息
     */
    const VIDEO_GROUPS = [
      {
        id: "rail-musume",
        name: "铁道少女动画相关",
        videos: [
          {
            id: "yiB65S9QYfM",
            url: "https://youtu.be/yiB65S9QYfM?si=KWnLwxY7wZ1ogKl7",
            title: "【てつりょー！×鉄道むすめ】課外活動～遠州鉄道編～（CV：春立うさ）",
            uploader: "鉄道むすめ公式",
            length: "2:13"
          },
          {
            id: "J4TrrAFCtw4",
            url: "https://youtu.be/J4TrrAFCtw4?si=_7w9hYDieDIbOZb4",
            title: "【てつりょー！meet with 鉄道むすめ】八神 牛緒の鉄道会社紹介 伊豆箱根鉄道編",
            uploader: "鉄道むすめ【公式】",
            length: "1:24"
          }
        ]
      },
      {
        id: "shiramori-sawa",
        name: "白森さわ相关",
        videos: [
          {
            id: "IPxxTOngM5o",
            url: "https://youtu.be/IPxxTOngM5o?si=EAXxym8Hm0SI8NOj",
            title: "白森サワ・甲斐真理野 卒業報告 緊急放送",
            uploader: "つくドル！公式チャンネル",
            length: "30:13"
          },
          {
            id: "_zFctbCbaM4",
            url: "https://youtu.be/_zFctbCbaM4?si=XbCIWsqDUEA_gYtZ",
            title: "「松井恵理子・内村史子のまイラぶすとりーと」第15回（2015.10.16）",
            uploader: "pixiv",
            length: "26:40"
          },
          {
            id: "dSs2Rmy-0q4",
            url: "https://youtu.be/dSs2Rmy-0q4?si=GgNJqxUQnCVpQPTx",
            title: "【経済BUZZ】ロゴを作ってもらいました！",
            uploader: "池ヶ谷通",
            length: "5:43"
          },
          {
            id: "V8GIc5JLCeM",
            url: "https://youtu.be/V8GIc5JLCeM?si=clg-UfJJJnZLYPnt",
            title: "【経済BUZZ】超人気女子高生イラストレーター白森さわさん",
            uploader: "テレビ東京 経済報道チャンネル",
            length: "9:30"
          },
          {
            id: "dkyXkMHlkvc",
            url: "https://youtu.be/dkyXkMHlkvc?si=CD-PG1hJsPg2DuHw",
            title: "【ASMR】3D dummy head mic👂🏻耳マッサージと耳タッピング【TKM ASMR × さわらコラボ】",
            uploader: "さわら - Sawara ASMR -",
            length: "26:28"
          }
        ]
      }
    ];

    // 当前选中的分类筛选器（"all" 表示显示全部分类）
    let activeFilter = "all";

    /**
     * HTML 特殊字符转义函数，防止文本注入破坏结构
     */
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[char]));
    }

    /**
     * 高清缩略图级联加载逻辑：
     * 1. 优先尝试最高清晰度 maxresdefault.jpg (1280x720)
     * 2. 若视频无 maxres 版本（YouTube 会返回 120x90 灰色占位图或 404），自动降级为 sddefault.jpg (640x480)
     * 3. 若仍无 sddefault，则降级为保证存在的 hqdefault.jpg (480x360)
     */
    function getThumbnailSources(videoId) {
      return [
        `https://i.ytimg.com/vi/${videoId}/maxresdefault.jpg`,
        `https://i.ytimg.com/vi/${videoId}/sddefault.jpg`,
        `https://i.ytimg.com/vi/${videoId}/hqdefault.jpg`,
        `https://placehold.co/640x360/18181b/a1a1aa?text=YouTube+Thumbnail`
      ];
    }

    function attachHighResFallback(imgEl, videoId) {
      const sources = getThumbnailSources(videoId);
      let step = 0;

      const tryNextSource = () => {
        step += 1;
        if (step < sources.length) {
          imgEl.src = sources[step];
        }
      };

      imgEl.addEventListener("error", tryNextSource);
      imgEl.addEventListener("load", () => {
        // YouTube 在不存在更高分辨率封面时会返回 120x90 的默认灰图，检测到后立即切换到下一档清晰度
        if (imgEl.naturalWidth > 0 && imgEl.naturalWidth <= 120 && step < sources.length - 1) {
          tryNextSource();
        }
      });

      imgEl.src = sources[0];
    }

    /**
     * 渲染分类筛选标签栏
     */
    function renderTabs() {
      const tabsEl = document.getElementById("category-tabs");
      const totalCount = VIDEO_GROUPS.reduce((sum, g) => sum + g.videos.length, 0);

      const allTabs = [
        { id: "all", label: "全部视频", count: totalCount },
        ...VIDEO_GROUPS.map((g) => ({ id: g.id, label: g.name, count: g.videos.length }))
      ];

      tabsEl.innerHTML = allTabs
        .map((tab) => {
          const isActive = activeFilter === tab.id;
          const activeClasses = isActive
            ? "bg-rose-600 text-white border-rose-600 shadow-sm shadow-rose-600/20"
            : "bg-white dark:bg-zinc-900 text-slate-600 dark:text-zinc-300 border-slate-200 dark:border-zinc-800 hover:bg-slate-50 dark:hover:bg-zinc-800";

          return `
            <button
              type="button"
              data-filter="${escapeHtml(tab.id)}"
              class="inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-medium border transition cursor-pointer ${activeClasses}"
            >
              <span>${escapeHtml(tab.label)}</span>
              <span class="text-xs px-2 py-0.5 rounded-full ${
                isActive
                  ? "bg-white/20 text-white"
                  : "bg-slate-100 dark:bg-zinc-800 text-slate-500 dark:text-zinc-400"
              }">${tab.count}</span>
            </button>
          `;
        })
        .join("");

      tabsEl.querySelectorAll("button[data-filter]").forEach((btn) => {
        btn.addEventListener("click", () => {
          activeFilter = btn.getAttribute("data-filter");
          renderTabs();
          renderGroups();
        });
      });
    }

    /**
     * 渲染视频分组与卡片列表
     */
    function renderGroups() {
      try {
        const container = document.getElementById("content");
        const visibleGroups =
          activeFilter === "all"
            ? VIDEO_GROUPS
            : VIDEO_GROUPS.filter((g) => g.id === activeFilter);

        container.innerHTML = visibleGroups
          .map(
            (group) => `
            <section class="space-y-5">
              <!-- 分组标题栏 -->
              <div class="flex items-center justify-between gap-3 pb-3 border-b border-slate-200 dark:border-zinc-800">
                <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white pl-3.5 border-l-4 border-rose-500 flex items-center gap-3">
                  <span>${escapeHtml(group.name)}</span>
                  <span class="text-xs sm:text-sm font-medium px-2.5 py-0.5 rounded-full bg-slate-200/80 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300">
                    ${group.videos.length} 个视频
                  </span>
                </h2>
              </div>

              <!-- 响应式视频卡片网格 -->
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                ${group.videos
                  .map(
                    (video) => `
                  <a
                    href="${escapeHtml(video.url)}"
                    target="_blank"
                    rel="noopener noreferrer"
                    title="${escapeHtml(video.title)}"
                    class="group bg-white dark:bg-zinc-900/90 border border-slate-200 dark:border-zinc-800/90 hover:border-rose-500/50 dark:hover:border-rose-500/50 rounded-2xl overflow-hidden shadow-sm hover:shadow-xl hover:shadow-black/10 dark:hover:shadow-black/40 transition-all duration-200 flex flex-col hover:-translate-y-1"
                  >
                    <!-- 16:9 高清缩略图容器 -->
                    <div class="relative w-full aspect-video bg-zinc-950 overflow-hidden">
                      <img
                        data-video-id="${escapeHtml(video.id)}"
                        alt="${escapeHtml(video.title)}"
                        loading="lazy"
                        class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                      />
                      <!-- 悬停播放提示遮罩 -->
                      <div class="absolute inset-0 bg-black/0 group-hover:bg-black/25 transition-colors duration-200 flex items-center justify-center">
                        <div class="w-12 h-12 rounded-full bg-rose-600/95 text-white flex items-center justify-center opacity-0 group-hover:opacity-100 scale-90 group-hover:scale-100 transition-all duration-200 shadow-lg">
                          <svg class="w-5 h-5 translate-x-0.5" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M8 5v14l11-7z" />
                          </svg>
                        </div>
                      </div>
                      <!-- 右下角视频时长角标 -->
                      <span class="absolute bottom-2.5 right-2.5 bg-black/85 backdrop-blur-sm text-white text-xs font-semibold px-2.5 py-1 rounded-lg tracking-wide border border-white/10">
                        ${escapeHtml(video.length)}
                      </span>
                    </div>

                    <!-- 视频标题、上传者与时长详情 -->
                    <div class="p-4 sm:p-5 flex-1 flex flex-col justify-between gap-4">
                      <h3 class="text-base font-semibold leading-snug text-slate-900 dark:text-zinc-100 group-hover:text-rose-600 dark:group-hover:text-rose-400 transition-colors line-clamp-2">
                        ${escapeHtml(video.title)}
                      </h3>

                      <div class="pt-3 border-t border-slate-100 dark:border-zinc-800/80 flex items-center justify-between gap-2 text-xs sm:text-sm text-slate-500 dark:text-zinc-400">
                        <div class="flex items-center gap-1.5 min-w-0">
                          <svg class="w-4 h-4 shrink-0 text-slate-400 dark:text-zinc-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                          </svg>
                          <span class="truncate">上传者：${escapeHtml(video.uploader)}</span>
                        </div>
                        <span class="shrink-0 text-xs font-medium px-2 py-0.5 rounded-md bg-slate-100 dark:bg-zinc-800 text-slate-600 dark:text-zinc-300">
                          时长 ${escapeHtml(video.length)}
                        </span>
                      </div>
                    </div>
                  </a>
                `
                  )
                  .join("")}
              </div>
            </section>
          `
          )
          .join("");

        // 为每张缩略图绑定高分辨率自动探测与降级加载
        container.querySelectorAll("img[data-video-id]").forEach((imgEl) => {
          const videoId = imgEl.getAttribute("data-video-id");
          attachHighResFallback(imgEl, videoId);
        });
      } catch (err) {
        console.error("渲染视频列表时发生错误:", err);
      }
    }

    // 页面加载完成后初始化界面（已锁定深色模式）
    window.addEventListener("DOMContentLoaded", () => {
      renderTabs();
      renderGroups();
    });
  </script>
</body>
</html>
